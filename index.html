<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="臺灣 22 縣市的人口增減與家庭收支，按月、按年在地圖上播放。2017 嘉義黑客松作品，2026 重寫。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>人口變遷視覺分析工具 · Taiwan Population Atlas</title>
    <script>
      // Apply the saved theme before the first paint so dark mode does not flash white.
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>這個地圖需要 JavaScript 才能顯示。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
